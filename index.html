<script>
/* ---------- nucleo ---------- */
var K="silenzio-della-piazza-v1";
var S={team:"",mem:"",a:{},d:{},fb:{},help:{},tries:{},skipped:{},unlocked:false,draw:{},screen:"start"};
try{var raw=localStorage.getItem(K);if(raw){var o=JSON.parse(raw);for(var k0 in o)S[k0]=o[k0];}}catch(e){}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},250)}
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function wc(s){var m=String(s||"").trim().match(/\S+/g);return m?m.length:0}
function norm(s){return String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[.,;:!?«»"()]/g,"").trim()}
function D(k){return !!S.d[k]}
function A(k){return S.a[k]==null?"":S.a[k]}
function setFb(k,kind,msg){S.fb[k]={kind:kind,msg:msg};if(!S.tries)S.tries={};if(kind==="bad")S.tries[k]=(S.tries[k]||0)+1;else S.tries[k]=0;save()}
function FB(k){var f=S.fb[k];if(!f||!f.msg)return "";var sk=f.kind==="bad"&&(S.tries&&S.tries[k]>=2)&&k!=="cons";
  return '<div class="fb '+f.kind+'" role="status">'+f.msg+(sk?'<div style="margin-top:8px">Siete bloccati? Potete andare avanti: contano soprattutto le risposte scritte. <button class="btn sm" type="button" data-act="skipP" data-v="'+k+'" style="margin-left:6px">Vai avanti comunque</button></div>':'')+'</div>'}
function tag(k){return D(k)?'<span class="done-tag">'+(S.skipped&&S.skipped[k]?'saltata':'fatto')+'</span>':""}
function ta(k,ph,min,max,rows){
  var v=A(k);
  return '<textarea id="f-'+k+'" data-k="'+k+'" placeholder="'+esc(ph||"")+'" rows="'+(rows||4)+'">'+esc(v)+'</textarea>'+
  '<div class="count'+(max&&wc(v)>max?' over':'')+'" data-cnt="'+k+'" data-min="'+(min||0)+'" data-max="'+(max||0)+'">'+cntTxt(v,min,max)+'</div>';
}
function cntTxt(v,min,max){var n=wc(v);return n+" parole"+(min?" · almeno "+min:"")+(max?" · al massimo circa "+max:"")}
function roomDone(i){return D(ROOMS[i].id+".S")}
function lettersDone(){return ROOMS.filter(function(r){return D(r.id+".S")}).length}
/* ---------- barra, testo, aiuti ---------- */
function renderSeals(){
  $("#seals").innerHTML=ROOMS.map(function(r,i){var on=roomDone(i);return '<span class="seal'+(on?' on':'')+'" title="Stanza '+(i+1)+'">'+(on?r.L:(i+1))+'</span>'}).join("")+
  '<span class="seal'+(S.unlocked?' on':'')+'" title="Finale" style="margin-left:6px">'+(S.unlocked?'★':'·')+'</span>';
}
function renderText(){
  var h='<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="eyebrow">Guido Cavalcanti · sonetto</div><button class="btn sm closeText" type="button" data-act="closeText">Chiudi</button></div>';
  h+='<h3 style="margin-bottom:10px">Chi è questa che vén, ch’ogn’om la mira</h3>';
  POEM.forEach(function(v,i){h+='<div class="verse'+(v[1]?' gap':'')+'"><i>'+(i+1)+'</i><span>'+v[0]+'</span></div>'});
  h+='<div class="notes">'+NOTES.map(function(n,i){return '<span><b>'+(i+1)+'.</b> '+esc(n)+'</span>'}).join("")+'</div>';
  h+='<details><summary>Il poeta</summary><p class="muted" style="margin:8px 0 0;font-size:.9rem">'+esc(AUTORE)+'</p></details>';
  $("#text").innerHTML=h;
}
function openOv(html){
  var o=$("#ov");if(!o){o=document.createElement("div");o.id="ov";o.style.cssText="position:fixed;inset:0;z-index:40;background:rgba(10,12,28,.6);display:grid;place-items:center;padding:16px";document.body.appendChild(o);}
  o.innerHTML='<div class="card" style="max-width:640px;width:100%;max-height:90vh;overflow:auto;margin:0">'+html+'<div class="row" style="justify-content:flex-end"><button class="btn pri" type="button" data-act="closeOv">Chiudi</button></div></div>';
  o.hidden=false;
}
function closeOv(){var o=$("#ov");if(o)o.hidden=true}
function helpHtml(){
  var inRoom=/^r\d$/.test(S.screen);
  var names={nota:"Nota",ril:"Rilettura",conf:"Confronto"};
  var h='<h3>Carte aiuto</h3><p class="muted">Ogni carta si usa una sola volta in tutto il gioco. Tocca una carta per spenderla nella stanza in cui ti trovi.</p>';
  ["nota","ril","conf"].forEach(function(c){
    var used=S.help[c];
    h+='<div class="card" style="margin:0 0 10px;padding:14px 16px"><b>'+names[c]+'</b> ';
    if(used){h+='<span class="muted">· usata nella stanza '+used.slice(1)+'</span><p style="margin:8px 0 0">'+esc(HELP[used][c])+'</p>'}
    else if(inRoom){h+='<div style="margin-top:8px"><button class="btn sm" type="button" data-act="useHelp" data-v="'+c+'">Usa questa carta</button></div>'}
    else{h+='<span class="muted">· disponibile</span>'}
    h+='</div>';
  });
  return h;
}
/* ---------- navigazione ---------- */
function go(sc){S.screen=sc;save();render();window.scrollTo(0,0);$("#text").classList.remove("open")}
function render(){
  var y=window.scrollY;
  renderSeals();
  var st=$("#stage"),sc=S.screen;
  if(sc==="start")st.innerHTML=viewStart();
  else if(sc==="hub")st.innerHTML=viewHub();
  else if(sc==="finale")st.innerHTML=viewFinale();
  else if(sc==="consegna")st.innerHTML=viewConsegna();
  else if(ROOMV[sc])st.innerHTML=ROOMV[sc]();
  if(sc==="finale"||sc==="consegna")setTimeout(initCanvases,0);
  window.scrollTo(0,y);
}
/* ---------- schermate iniziali ---------- */
function viewStart(){
  return '<section class="hero"><div class="eyebrow">Escape room · Dolce stil novo</div>'+
  '<h1>Il silenzio della piazza</h1>'+
  '<p class="lead">Firenze, fine Duecento. Una donna attraversa la piazza. L’aria trema di luce, Amore cammina accanto a lei e tutti si fermano a guardarla. Nessuno riesce a parlare: restano solo i sospiri.</p>'+
  '<p style="max-width:40em">Voi siete tra la folla ammutolita. Per ritrovare le parole attraversate quattro stanze della mente di Guido Cavalcanti, il poeta che ha visto la scena e non sa come raccontarla. Ogni sigillo vi restituisce una lettera. Con le quattro lettere ricomporrete una parola sola, e allora scriverete ciò che nessuno in piazza riesce a dire.</p></section>'+
  '<div class="card" style="max-width:640px"><h3>La squadra</h3><p class="muted">Un dispositivo per squadra. Le risposte restano salvate su questo dispositivo.</p>'+
  '<label for="f-team" class="eyebrow">Nome della squadra</label><input type="text" id="f-team" data-k="S.team" value="'+esc(S.team)+'" style="margin:4px 0 12px">'+
  '<label for="f-mem" class="eyebrow">Componenti</label><input type="text" id="f-mem" data-k="S.mem" value="'+esc(S.mem)+'" placeholder="Nomi separati da virgola" style="margin:4px 0 14px">'+
  '<p class="muted">Ruoli a rotazione a ogni stanza: chi legge ad alta voce, chi scrive, chi cerca le note, chi tiene il tempo.</p><p class="muted">Le prove a scelta sono un gioco, e se vi bloccate potete andare avanti. Le risposte scritte sono quelle che la docente leggerà: curatele.</p>'+
  '<button class="btn pri" type="button" data-act="begin">Entra nella prima stanza</button></div>';
}
function viewHub(){
  var h='<h2>Mappa della mente</h2><p class="muted" style="margin:6px 0 16px">Le stanze si aprono una dopo l’altra. Se un sigillo non si apre ricevete un indizio. Dopo due tentativi si può andare avanti: nessuno resta bloccato.</p><div class="rooms">';
  ROOMS.forEach(function(r,i){
    var ok=roomDone(i),lock=i>0&&!roomDone(i-1);
    h+='<button class="room'+(ok?' ok':'')+'" type="button" '+(lock?'disabled ':'')+'data-act="goRoom" data-v="'+r.id+'"><span class="eyebrow">Stanza '+(i+1)+'</span><span class="n">'+r.n+'</span><span class="muted">'+r.sk+'</span><span class="st">'+(ok?"sigillo "+r.L+" raccolto":lock?"chiusa":"aperta")+'</span></button>';
  });
  h+='<button class="room'+(D("fin")?' ok':'')+'" type="button" '+(S.unlocked?'':'disabled ')+'data-act="go" data-v="finale"><span class="eyebrow">Finale</span><span class="n">La parola</span><span class="muted">Analisi e interpretazione scritte</span><span class="st">'+(S.unlocked?"aperta":"chiusa")+'</span></button></div>';
  if(lettersDone()===4&&!S.unlocked){
    h+='<div class="sigillo" style="margin-top:20px"><h3>Le quattro lettere</h3><p>Sono arrivate in ordine sparso. Riordinatele: l’indizio è nel v. 1, dove si dice che cosa fa «ogn’om» quando la donna passa.</p><div class="letters">'+
    ROOMS.map(function(r){return '<span class="seal on">'+r.L+'</span>'}).join("")+'</div>'+
    '<div class="row"><input type="text" id="f-ana" data-k="ana" value="'+esc(A("ana"))+'" style="max-width:240px" placeholder="La parola" aria-label="La parola formata dalle lettere"><button class="btn pri" type="button" data-act="ana">Pronuncia la parola</button></div>'+FB("ana")+'</div>';
  }
  return h;
}
/* ---------- azioni ---------- */
var ACT={
 begin:function(){go("hub")},
 go:function(el){go(el.dataset.v)},
 goRoom:function(el){go(el.dataset.v)},
 closeText:function(){$("#text").classList.remove("open")},
 closeOv:closeOv,
 useHelp:function(el){var c=el.dataset.v;if(!S.help[c]&&/^r\d$/.test(S.screen)){S.help[c]=S.screen;save();openOv(helpHtml())}},
 ana:function(){
   if(norm(A("ana"))==="mira"){S.unlocked=true;setFb("ana","good","Tutti la mirano, e le parole tornano.");save();go("finale")}
   else setFb("ana","bad","Le lettere sono giuste, l’ordine no. Rileggi il v. 1: che cosa fa ognuno quando lei passa?");render()
 }
};
ACT.skipP=function(el){var k=el.dataset.v;if(!S.skipped)S.skipped={};
  if(k==="ana"){S.unlocked=true;S.skipped.ana=true;save();return go("finale")}
  if(k==="fin"){S.d.fin=true;S.skipped.fin=true;save();return go("consegna")}
  S.d[k]=true;S.skipped[k]=true;S.fb[k]=null;save()};
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  var f=ACT[el.dataset.act];if(f){f(el);if(["closeOv","closeText","useHelp","go","goRoom","begin"].indexOf(el.dataset.act)<0&&el.dataset.act!=="ana")render();}
});
function onField(t){
  var k=t.dataset.k;if(!k)return;
  var v=t.type==="checkbox"?t.checked:t.value;
  if(k.indexOf("S.")===0)S[k.slice(2)]=v;else S.a[k]=v;
  save();
  var c=document.querySelector('[data-cnt="'+k+'"]');

}
document.addEventListener("input",function(e){onField(e.target)});
document.addEventListener("change",function(e){onField(e.target)});
$("#helpbtn").addEventListener("click",function(){openOv(helpHtml())});
$("#textbtn").addEventListener("click",function(){$("#text").classList.add("open")});
$("#homebtn").addEventListener("click",function(){go(S.screen==="start"?"start":"hub")});

<script>
/* ---------- stanze 1 e 2 ---------- */
var ROOMV={};
var SIG={r1:/(mena|menar)/,r2:/\bira\b/,r3:/amor/,r4:/rim/};
var SIGH={r1:"Non è questa. Guarda la nota 3: «e mena seco Amor» vale «e conduce con sé l’Amore». Qual è il verbo che regge «Amor»?",
 r2:"Non è questa. Guarda la parola che chiude il v. 8, in rima con «mira», e la nota 8.",
 r3:"Non è questa. Cerca la parola con l’iniziale maiuscola che compare nel v. 3 e di nuovo nel v. 6.",
 r4:"Non è questa. Pensa a ciò che lega la fine di un verso alla fine di un altro."};
var SIGQ={r1:"Nella parafrasi del v. 3 avete letto «e mena seco Amor». Scrivete il verbo che regge «Amor», così come compare nel testo.",
 r2:"Nei vv. 7-8 la donna è «d’umiltà donna» e ogni altra donna, in confronto a lei, viene chiamata con il contrario di «umiltà». Scrivete quella parola.",
 r3:"Una parola personificata compare al v. 3 e ritorna al v. 6: è quella che avete riconosciuto come «ripresa». Scrivetela come compare nel testo.",
 r4:"Nel sonetto di Rustico il cattivo odore è evocato anche dall’eco di «cesso» (v. 1) in «presso», «gresso» e «alcipresso». In quale posizione del verso avviene questo eco? Scrivete una parola."};

function roomHead(i,intro){var r=ROOMS[i];return '<div class="eyebrow">Stanza '+(i+1)+' di 4 · '+r.sk+'</div><h2 style="margin:4px 0 8px">'+r.n+'</h2><p class="muted" style="max-width:44em">'+intro+'</p>'}
function sigCard(i){
  var r=ROOMS[i],id=r.id;
  if(D(id+".S"))return '<div class="sigillo"><div class="row"><span class="seal on" style="width:56px;height:56px;font-size:1.7rem">'+r.L+'</span><div><b>Sigillo raccolto: la lettera '+r.L+'</b><div class="muted">La stanza si apre.</div></div></div><div style="margin-top:12px"><button class="btn pri" type="button" data-act="'+(i<3?'goRoom" data-v="'+ROOMS[i+1].id:'go" data-v="hub')+'">'+(i<3?'Vai alla stanza '+(i+2):'Torna alla mappa')+'</button></div></div>';
  return '<div class="sigillo"><div class="eyebrow">Il sigillo</div><p style="margin:6px 0 10px">'+SIGQ[id]+'</p><div class="row"><input type="text" id="f-'+id+'.sin" data-k="'+id+'.sin" value="'+esc(A(id+".sin"))+'" style="max-width:260px" aria-label="Risposta del sigillo"><button class="btn pri" type="button" data-act="sig" data-v="'+id+'">Prova il sigillo</button></div>'+FB(id+".S")+'</div>';
}
ACT.sig=function(el){var id=el.dataset.v;if(SIG[id].test(norm(A(id+".sin")))){S.d[id+".S"]=true;setFb(id+".S","good","")}else setFb(id+".S","bad",SIGH[id])};
/* ---- stanza 1 ---- */
function errGroup(w){var n=norm(w);for(var i=0;i<ERR.length;i++)if(ERR[i].w.indexOf(n)>=0)return i;return -1}
function r1items(){
  var sel=S.a["r1.sel"]||[],seen={},out=[];
  sel.forEach(function(id){var p=+id.split("-")[0],w=PARA[p][1].split(" ")[+id.split("-")[1]],g=errGroup(w),key=g>=0?"g"+g:"x"+id;
    if(!seen[key]){seen[key]=1;out.push({key:key,g:g,lbl:g>=0?ERR[g].w.join(" "):norm(w),vv:PARA[p][0]})}});
  return out;
}
ACT.tok=function(el){if(D("r1.A"))return;var s=S.a["r1.sel"]||[],id=el.dataset.v,i=s.indexOf(id);if(i>=0)s.splice(i,1);else s.push(id);S.a["r1.sel"]=s;S.fb["r1.A"]=null;save()};
ACT.r1A=function(){
  var it=r1items();
  if(!it.length)return setFb("r1.A","bad","Tocca le parole che ti sembrano sbagliate e scrivi quella giusta.");
  var good=it.filter(function(x){return x.g>=0&&ERR[x.g].re.test(norm(A("r1.fix."+x.key)))}).length;
  if(good<4){
    var hints=it.filter(function(x){return x.g>=0&&!ERR[x.g].re.test(norm(A("r1.fix."+x.key)))}).map(function(x){return "«"+x.lbl+"»: "+ERR[x.g].h});
    var found=it.filter(function(x){return x.g>=0}).length;
    return setFb("r1.A","bad","Correzioni giuste: "+good+" su 6, ne bastano 4. "+(found<4?"Cerca altre parole sospette. ":"")+(hints.length?"<br>"+hints.slice(0,2).join("<br>"):""));
  }
  S.d["r1.A"]=true;setFb("r1.A","good","Ottimo: "+good+" errori su 6 smascherati.");
};
ACT.r1B=function(){
  if(wc(A("r1.B"))<10)return setFb("r1.B","bad","Scrivi qualche riga in più: bastano due o tre frasi che spieghino i vv. 9-11.");
  S.d["r1.B"]=true;setFb("r1.B","good","Parafrasi consegnata.");
};
ACT.r1C=function(){
  var miss=COMP.filter(function(c){return wc(A("r1."+c[0]))<c[3]}).map(function(c){return c[1]});
  if(miss.length)return setFb("r1.C","bad","Risposte ancora troppo brevi: "+miss.join(", ")+". Spiegate con parole vostre e citate il testo.");
  S.d["r1.C"]=true;setFb("r1.C","good","Risposte consegnate.");
};
ROOMV.r1=function(){
  var h=roomHead(0,"La piazza è bloccata da un guardiano che parla male e che ha dimenticato la parte centrale del discorso. Per passare dovete smascherare la sua parafrasi e scriverne una vostra.");
  var sel=S.a["r1.sel"]||[],items=r1items(),done=D("r1.A");
  h+='<div class="card prova"><div class="eyebrow">Prova A</div><h3>La parafrasi bugiarda'+tag("r1.A")+'</h3><p>Il guardiano ha parafrasato il sonetto, ma ha messo sei parole sbagliate. Tocca le parole sospette, poi scrivi quella giusta. I vv. 9-11 mancano: sono la Prova B.</p>';
  PARA.forEach(function(p,pi){
    h+='<p class="para"><span class="lbl">'+p[0]+'</span>'+p[1].split(" ").map(function(w,wi){var id=pi+"-"+wi,on=sel.indexOf(id)>=0,g=errGroup(w);
      return '<button type="button" class="tok'+(done&&g>=0?' found':on?' sel':'')+'" data-act="tok" data-v="'+id+'" aria-pressed="'+on+'"'+(done?' disabled':'')+'>'+esc(w)+'</button>'}).join(" ")+'</p>';
  });
  items.forEach(function(x){
    h+='<div class="fix"><span class="w">'+esc(x.lbl)+' <small class="muted">('+x.vv+')</small></span><input type="text" id="f-r1.fix.'+x.key+'" data-k="r1.fix.'+x.key+'" value="'+esc(A("r1.fix."+x.key))+'" placeholder="parola giusta" aria-label="Parola giusta per '+esc(x.lbl)+'"'+(done?' disabled':'')+'>'+
    '<input type="text" id="f-r1.why.'+x.key+'" data-k="r1.why.'+x.key+'" value="'+esc(A("r1.why."+x.key))+'" placeholder="come l’hai capito (facoltativo)" aria-label="Come lo hai capito"'+(done?' disabled':'')+'></div>';
  });
  if(!done)h+='<div style="margin-top:12px"><button class="btn pri" type="button" data-act="r1A">Controlla gli errori</button></div>';
  h+=FB("r1.A")+'</div>';
  if(done){

function initCanvases(){
  for(var i=0;i<4;i++)(function(i){
    var cv=document.getElementById("cv"+i);if(!cv)return;var ctx=cv.getContext("2d");
    ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.lineCap="round";ctx.lineJoin="round";
    if(S.draw[i]){var im=new Image();im.onload=function(){ctx.drawImage(im,0,0)};im.src=S.draw[i]}
    var on=false,lx=0,ly=0;
    function pt(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
    cv.addEventListener("pointerdown",function(e){on=true;var p=pt(e);lx=p[0];ly=p[1];try{cv.setPointerCapture(e.pointerId)}catch(x){}
      var c=S.a["sb.col"]||COLS[0];ctx.strokeStyle=c;ctx.lineWidth=c==="#ffffff"?30:5;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+.1,ly+.1);ctx.stroke();e.preventDefault()});
    cv.addEventListener("pointermove",function(e){if(!on)return;var p=pt(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p[0],p[1]);ctx.stroke();lx=p[0];ly=p[1];e.preventDefault()});
    function end(){if(!on)return;on=false;try{S.draw[i]=cv.toDataURL("image/png");save()}catch(x){}}
    cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  })(i);
}
function buildReport(){

  var sk=Object.keys(S.skipped||{});P("Prove saltate: "+(sk.length?sk.join(", "):"nessuna"));P("");
  P("== STANZA 1 · Parafrasi e comprensione ==");

  P("Parafrasi vv. 9-11: "+A("r1.B"));

  P("== STANZA 2 · Parole-chiave ==");

  P("== STANZA 3 · Figure retoriche e perché ==");
  WHY.forEach(function(w){P(w[1]+": "+A("r3."+w[0]))});P("");
  P("== STANZA 4 · Collegamenti ==");
  P("Confronto con «Voi che»: "+A("r4.C"));
  P("Rustico Filippi, senso che sostituisce la vista: "+(A("r4.rs")||"—"));
  P("Rustico Filippi, confronto: "+A("r4.Rw"));P("");
  P("== FINALE · La parola ==");
  FIN.forEach(function(f){P(f[1]+":");P(A(f[0])||"—");P("")});
  for(var i=0;i<4;i++)if(A("sb.cap"+i))P("Vignetta "+(i+1)+": "+A("sb.cap"+i));
  return L.join("\n");
}
